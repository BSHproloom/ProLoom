<div class="tasks-container">
  <h2>My Assigned Tasks</h2>

  <div class="task-list">
    <mat-card *ngFor="let task of tasks" class="task-card" [class.active-task]="task.is_working">
      <mat-card-header>
        <mat-card-title>{{task.composite_item_name}} ({{task.id}})</mat-card-title>
        <mat-card-subtitle>Project: {{task.project_fk}} • Size: {{task.size}}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <div class="status-row" style="margin-bottom: 16px;">
          <mat-chip [class.revision]="task.status === 'Revision Needed'">{{task.status}}</mat-chip>
          <div class="timer-display" [class.running]="task.is_working">
            <mat-icon>{{task.is_working ? 'timer' : 'timer_off'}}</mat-icon>
            {{task.timerDisplay}}
          </div>
        </div>
        
        <div *ngIf="!task.designer_readiness_date && task.status === 'Assigned'" style="margin-top: 8px;">
          <small style="display:block; margin-bottom: 4px; color:#666;">Estimated Finishing Date:</small>
          <input type="date" [(ngModel)]="task.designer_readiness_date" (change)="saveDate(task)" style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div *ngIf="task.designer_readiness_date" style="margin-top: 8px; font-size: 14px;">
          <strong>Est. Finishing:</strong> {{ formatDate(task.designer_readiness_date) }}
        </div>
      </mat-card-content>

      <mat-card-actions class="actions-row">
        <button mat-raised-button 
                [color]="task.is_working ? 'warn' : 'primary'" 
                (click)="toggleTimer(task)">
          <mat-icon>{{task.is_working ? 'stop' : 'play_arrow'}}</mat-icon>
          {{task.is_working ? 'Stop Work' : 'Start Work'}}
        </button>

        <span class="spacer"></span>

        <button mat-button *ngIf="task.status === 'In Progress' && !task.is_working" (click)="advanceStatus(task)">
          Submit for Approval
        </button>
        <button mat-button *ngIf="task.status === 'Revision Requested'" (click)="advanceStatus(task)">
          Begin Revision
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
