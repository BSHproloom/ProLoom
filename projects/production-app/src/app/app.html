<ng-container *ngIf="!isLoggedIn">
  <lib-login [role]="'Factory Production'" [errorMsg]="loginError" (microsoftLogin)="onMicrosoftLoginSubmit($event)"></lib-login>
</ng-container>

<ng-container *ngIf="isLoggedIn">
  <header class="modern-topbar">
    <button mat-icon-button (click)="toggleSidebar()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    <div class="brand-container hide-on-mobile">
      <mat-icon class="brand-icon">precision_manufacturing</mat-icon>
      <span class="title">Factory Floor</span>
    </div>
    <span class="spacer"></span>
    <lib-notification-bell [recipientRole]="'Production'"></lib-notification-bell>
    <button mat-flat-button color="warn" (click)="logout()">Logout</button>
  </header>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav [opened]="isSidebarOpen" mode="side" class="sidenav" fixedInViewport="true" fixedTopGap="64">
      <mat-nav-list class="pt-4">
        <a mat-list-item routerLink="/sample-request" routerLinkActive="active-link" class="nav-item">
          <mat-icon matListItemIcon style="color: #ef4444;">style</mat-icon>
          <span matListItemTitle style="color: #ef4444; font-weight: 500;">Manual Samples</span>
        </a>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link" class="nav-item">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/upcoming-job-orders" routerLinkActive="active-link" class="nav-item">
          <mat-icon matListItemIcon>list_alt</mat-icon>
          <span matListItemTitle>Upcoming Job Orders</span>
        </a>
        <a mat-list-item routerLink="/loom-management" routerLinkActive="active-link" class="nav-item">
          <mat-icon matListItemIcon>precision_manufacturing</mat-icon>
          <span matListItemTitle>Loom Management</span>
        </a>
        <a mat-list-item routerLink="/samples" routerLinkActive="active-link" class="nav-item">
          <mat-icon matListItemIcon>style</mat-icon>
          <span matListItemTitle>Sample Requests</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>

  <nav class="bottom-nav mat-elevation-z4">
    <a routerLink="/dashboard" routerLinkActive="active-nav">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>
    <a routerLink="/upcoming-job-orders" routerLinkActive="active-nav">
      <mat-icon>list_alt</mat-icon>
      <span>Job Orders</span>
    </a>
    <a routerLink="/loom-management" routerLinkActive="active-nav">
      <mat-icon>precision_manufacturing</mat-icon>
      <span>Looms</span>
    </a>
    <a routerLink="/samples" routerLinkActive="active-nav">
      <mat-icon>style</mat-icon>
      <span>Samples</span>
    </a>
  </nav>
</ng-container>
