<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Production Tracking</h1>
  </div>

  <mat-card class="table-card" *ngIf="samples.length > 0; else noSamples">
    <div class="table-container overflow-x-auto">
      <table mat-table [dataSource]="samples" class="w-full text-left border-collapse">
        
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"> Sample ID </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-4 text-sm font-medium text-gray-900"> {{element.id}} </td>
        </ng-container>

        <ng-container matColumnDef="carpet_fk">
          <th mat-header-cell *matHeaderCellDef class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"> Carpet SKU </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-4 text-sm text-gray-600"> {{element.carpet_fk}} </td>
        </ng-container>

        <ng-container matColumnDef="sample_type">
          <th mat-header-cell *matHeaderCellDef class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"> Type </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-4 text-sm text-gray-600"> {{element.sample_type}} </td>
        </ng-container>

        <ng-container matColumnDef="completion_date">
          <th mat-header-cell *matHeaderCellDef class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"> Completion Date </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-4 text-sm text-gray-600">
            <span *ngIf="element.completion_date" class="font-medium text-gray-700">{{element.completion_date | date}}</span>
            <span *ngIf="!element.completion_date" class="text-gray-400 italic">Pending</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="py-3 px-4 text-xs font-semibold text-gray-500 uppercase tracking-wider"> Status </th>
          <td mat-cell *matCellDef="let element" class="py-3 px-4">
            <span class="px-3 py-1 rounded-full text-xs font-semibold shadow-sm border"
              [ngClass]="{
                'bg-yellow-50 text-yellow-700 border-yellow-200': element.status === 'Pending',
                'bg-blue-50 text-blue-700 border-blue-200': element.status === 'In Progress',
                'bg-red-50 text-red-700 border-red-200': element.status === 'Revision Requested',
                'bg-green-50 text-green-700 border-green-200': element.status === 'Approved' || element.status === 'Completed'
              }">
              {{element.status}}
            </span>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50 border-b border-gray-100"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50/50 transition-colors duration-150 border-b border-gray-100"></tr>
      </table>
    </div>
  </mat-card>

  <ng-template #noSamples>
    <div class="text-center py-8 text-gray-500 border border-dashed rounded-xl">
      No samples currently in production.
    </div>
  </ng-template>
</div>
