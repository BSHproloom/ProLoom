<div class="queue-container">
  <h2>Design Queue (Bulk Assignment)</h2>

  <div class="bulk-actions">
    <mat-form-field appearance="outline">
      <mat-label>Assign to Designer</mat-label>
      <mat-select [(value)]="selectedDesigner">
        <mat-option *ngFor="let d of designers" [value]="d">{{d}}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="primary" [disabled]="selection.selected.length === 0 || !selectedDesigner" (click)="assign()">
      Assign Selected ({{selection.selected.length}})
    </button>
  </div>

  <div class="mat-elevation-z2">
    <table mat-table [dataSource]="dataSource">
      
      <!-- Checkbox Column -->
      <ng-container matColumnDef="select">
        <th mat-header-cell *matHeaderCellDef>
          <mat-checkbox (change)="$event ? toggleAllRows() : null"
                        [checked]="selection.hasValue() && isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()">
          </mat-checkbox>
        </th>
        <td mat-cell *matCellDef="let row">
          <mat-checkbox (click)="$event.stopPropagation()"
                        (change)="$event ? selection.toggle(row) : null"
                        [checked]="selection.isSelected(row)">
          </mat-checkbox>
        </td>
      </ng-container>

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef> SKU </th>
        <td mat-cell *matCellDef="let element"> {{element.id}} </td>
      </ng-container>

      <ng-container matColumnDef="project_fk">
        <th mat-header-cell *matHeaderCellDef> Project </th>
        <td mat-cell *matCellDef="let element"> {{element.project_fk}} </td>
      </ng-container>

      <ng-container matColumnDef="composite_item_name">
        <th mat-header-cell *matHeaderCellDef> Carpet Name </th>
        <td mat-cell *matCellDef="let element"> {{element.composite_item_name}} </td>
      </ng-container>

      <ng-container matColumnDef="size">
        <th mat-header-cell *matHeaderCellDef> Size </th>
        <td mat-cell *matCellDef="let element"> {{element.size}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="selection.toggle(row)"></tr>
    </table>
    <div class="empty-state" *ngIf="dataSource.data.length === 0">
      No carpets need assignment.
    </div>
  </div>
</div>
